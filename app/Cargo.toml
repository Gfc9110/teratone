[package]
name = "opendaw-app"
version = "0.2.0"
edition = "2021"
license = "MIT"
build = "build.rs"
publish = false

[features]
default = ["ui"]
ui = ["dep:slint", "dep:slint-build", "dep:rfd"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
rfd = { version = "=0.17.2", optional = true }
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[[bin]]
name = "opendaw"
path = "src/main.rs"
required-features = ["ui"]

[[bin]]
name = "opendaw-project"
path = "src/project_cli.rs"

[[example]]
name = "layout_probe"
path = "examples/layout_probe.rs"
required-features = ["ui"]

[[example]]
name = "context_menu_probe"
path = "examples/context_menu_probe.rs"
required-features = ["ui"]

[[example]]
name = "workspace_probe"
path = "examples/workspace_probe.rs"
required-features = ["ui"]

[[example]]
name = "midi_view_probe"
path = "examples/midi_view_probe.rs"
required-features = ["ui"]

[[example]]
name = "project_workflow_probe"
path = "examples/project_workflow_probe.rs"
required-features = ["ui"]

[[example]]
name = "view_state_probe"
path = "examples/view_state_probe.rs"
required-features = ["ui"]

[profile.release]
lto = "thin"
codegen-units = 1
