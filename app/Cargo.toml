[package]
name = "opendaw-app"
version = "0.2.0"
edition = "2021"
license = "MIT"
build = "build.rs"
publish = false

[features]
default = ["ui"]
ui = ["dep:slint", "dep:slint-build"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
slint = { version = "=1.18.1", optional = true, default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }

[build-dependencies]
slint-build = { version = "=1.18.1", optional = true }

[[bin]]
name = "opendaw"
path = "src/main.rs"
required-features = ["ui"]

[[bin]]
name = "opendaw-project"
path = "src/project_cli.rs"

[[example]]
name = "layout_probe"
path = "examples/layout_probe.rs"
required-features = ["ui"]

[profile.release]
lto = "thin"
codegen-units = 1
